[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portshim"
version = "1.0.0"
description = "On-site security assessment pipeline — Hermes-orchestrated, distro-agnostic"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
]
report = [
    "python-docx>=1.1",
    "python-pptx>=1.0",
    "openpyxl>=3.1",
    "weasyprint>=62",
    "pillow>=10",
]
core = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "fpdf2>=2.7",
]

[tool.setuptools]
# Nothing at the repo root is importable — `portshim` is a script invoked directly, not a
# module — and several top-level directories each look like a separate package to
# setuptools, so its automatic discovery refuses the flat layout. Declaring that nothing is
# packaged is the truthful statement: this project ships scripts and a CLI, not a distribution.
packages = []
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: tests requiring network access",
    "smoke: full pipeline smoke tests",
    "uat: user acceptance tests for wired pipeline",
]
